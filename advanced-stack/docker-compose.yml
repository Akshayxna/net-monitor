version: "3.8"

services: 
  reverse-proxy:
    image: nginx:latest
    container_name: my_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: 
      - web_app
    networks:
      - frontend

  web_app:
    image: python:3.9-slim
    command: python -m http.server 8000
    networks:
      - frontend
      - backend
    deploy:
      replicas: 3
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    container_name: my_mongodb
    ports:
      - "27017:27017"
    environment:
      # These variables create a root user for the 'admin' database
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      # Optional: create a default application database on startup
      MONGO_INITDB_DATABASE: myappdb
    volumes:
      # This named volume persists your data on the host machine
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend
  
networks:
  frontend:
  backend:

volumes:
  mongo-data:
