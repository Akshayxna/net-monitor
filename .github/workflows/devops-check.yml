name: Docker compose Linter

# 1. WHEN SHOULD THE ROBOT WAKEUP 

on: 
  push:
    branches: [master]
  pull_request: 
    branches: [master]

#2. What should the Robot do

jobs: 
  validate-docker: 
    runs-on: ubuntu-latest
    
    steps: 
      - name: checkout code
        uses: actions/checkout@v4

      - name: validate docker compose file
        run: docker compose ./advanced-stack/docker-compose.yml config